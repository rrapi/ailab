
version: "2.3"
services:

  xserver:
    image: devrt/xserver
    container_name: xserver
    ipc: host
    security_opt:
      - seccomp:unconfined
    environment:
      - DISPLAY=:9
    ports:
      - "3000:80"

  gazebo:
    image: francirrapi/ros_noetic_gazebo:0.3
    container_name: simulator
    runtime: nvidia
    tty: true
    ipc: host
    network_mode: "host"
    privileged: true
    security_opt:
      - seccomp:unconfined
    environment:
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/home/robot/.Xauthority
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
      #- ${AILAB_DIR}:/home/robot/src/ailab
      - /home/lab/Projects/AI4HRC/src/MaCoRoGPT:/home/robot/src/MaCoRoGPT
    devices:
      - /dev/bus/usb:/dev/bus/usb
    working_dir: /home/robot/
    entrypoint:
    - bash
    - -ci
    - "cd /home/robot/src/ailab/bin && ./init_sim.bash"
