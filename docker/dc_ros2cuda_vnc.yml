services:

  xserver:
    image: devrt/xserver
    container_name: xserver
    ipc: host
    security_opt:
      - seccomp:unconfined
    environment:
      - DISPLAY=:9
    ports:
      - "3000:80"

  robot:
    image: ros2_jazzy_cuda
    container_name: ros2_cuda
    tty: true
    ipc: host
    network_mode: host
    privileged: true
    security_opt:
      - seccomp:unconfined
    environment:
      - DISPLAY=:9 # Kept at :9 to pipe into the browser xserver container
      - QT_X11_NO_MITSHM=1
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes_from:
      - xserver
    depends_on:
      - xserver
    volumes:
      - /home/lab/Projects/AI4HRC/src/GraspGPT:/home/robot/src/GraspGPT
      - /home/lab/Projects/AI4HRC/src/Depth-Anything-V2:/home/robot/src/Depth-Anything-V2
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
    devices:
      - /dev/snd:/dev/snd
      - /dev/bus/usb:/dev/bus/usb
    working_dir: /home/robot/
    entrypoint:
      - bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
