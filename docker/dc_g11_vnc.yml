version: "2.3"
services:

  xserver:
    image: devrt/xserver
    container_name: xserver
    ipc: host
    security_opt:
      - seccomp:unconfined
    environment:
      - DISPLAY=:9
    ports:
      - "3000:80"

  gazebo:
    image: francirrapi/ros_noetic_gazebo:0.3
    container_name: simulator
    tty: true
    ipc: host
    network_mode: host
    privileged: true
    security_opt:
      - seccomp:unconfined
    environment:
      - DISPLAY=:9
    volumes_from:
      - xserver
    depends_on:
      - xserver
    volumes:
      - ..:/home/robot/src/ailab
      - /home/lab/Projects/AI4HRC/src/D-RMGPT:/home/robot/src/D-RMGPT
      - /home/lab/Projects/AI4HRC/src/CoRoGPT:/home/robot/src/CoRoGPT
    devices:
      - /dev/snd:/dev/snd
      #- /dev/bus/usb/002/016:/dev/bus/usb/002/016
      #- /dev/bus/usb/002/018:/dev/bus/usb/002/018
      - /dev/bus/usb:/dev/bus/usb
      #- /dev/video0:/dev/video0
      #- /dev/video6:/dev/video6
    working_dir: /home/robot/
    # command: ["/bin/bash", "/usr/local/bin/startup.sh"]
    entrypoint:
      - bash
    # - ./home/robot/src/ailab/docker/dev_setup.bash
    #- -ci 
    #- "cd /home/robot/src/ailab/bin && ./init_sim.bash ur5e"


